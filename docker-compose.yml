services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_DATABASE: education_dss
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/db:/docker-entrypoint-initdb.d:ro   # วางไฟล์ dump (.sql) ไว้ในโฟลเดอร์นี้ก่อน docker compose up ครั้งแรก
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - mysql

  backend:
    build: .
    container_name: api
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:3009}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      CACHE_STORE: ${CACHE_STORE:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: education_dss
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_REQUIRE_EXPIRATION: ${JWT_REQUIRE_EXPIRATION:-false}
      PERSONNEL_API_URL: ${PERSONNEL_API_URL}
      PORTAL_MAIN_API_KEY: ${PORTAL_MAIN_API_KEY}
      MOCK_LOGIN_ENABLED: ${MOCK_LOGIN_ENABLED:-false}
      MOCK_LOGIN_ADMIN_NONTRI_IDS: ${MOCK_LOGIN_ADMIN_NONTRI_IDS:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3008}
    ports:
      - "3009:3009"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../education-web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3009/api}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-}
        VITE_MOCK_LOGIN_ENABLED: ${MOCK_LOGIN_ENABLED:-false}
    container_name: web
    ports:
      - "3008:80"
    depends_on:
      - backend

volumes:
  dbdata:

networks:
  default:
    name: education-dss
    external: true
