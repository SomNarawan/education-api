services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_DATABASE: education_dss
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/db:/docker-entrypoint-initdb.d:ro   # วางไฟล์ dump (.sql) ไว้ในโฟลเดอร์นี้ก่อน docker compose up ครั้งแรก
    healthcheck:
      # TCP, not the socket: the temporary server that imports the dump only
      # opens the socket, so a socket ping reports healthy before import ends.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      - mysql

  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: api
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:3009}
      # Fixed on purpose, not read from .env: the database comes from the SQL
      # dump and has no sessions/cache/jobs tables, and this stack runs no
      # queue worker (database queue jobs would never run).
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: education_dss
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_REQUIRE_EXPIRATION: ${JWT_REQUIRE_EXPIRATION:-true}
      # Portal login (KU All Login through ENG Main). Only the variables listed
      # here reach the container.
      PORTAL_MAIN_API_URL: ${PORTAL_MAIN_API_URL:-https://office.eng.kps.ku.ac.th/eng-main/api}
      PORTAL_SYSTEM_ID: ${PORTAL_SYSTEM_ID:-33}
      PORTAL_ROLE_MAP: ${PORTAL_ROLE_MAP:-admin:admin,staff:teacher}
      ORG_AUTH_API_URL: ${ORG_AUTH_API_URL:-https://eng.kps.ku.ac.th/std-eng-auth-service}
      PORTAL_VERIFY_SSL: ${PORTAL_VERIFY_SSL:-true}
      PORTAL_CA_FILE: ${PORTAL_CA_FILE:-}
      PORTAL_TIMEOUT: ${PORTAL_TIMEOUT:-10}
      PORTAL_RECHECK_SECONDS: ${PORTAL_RECHECK_SECONDS:-120}
      CMIS_URL: ${CMIS_URL}
      CMIS_SERVICE_BASE_PATH: ${CMIS_SERVICE_BASE_PATH:-/api}
      CMIS_SERVICE_TIMEOUT: ${CMIS_SERVICE_TIMEOUT:-15}
      CMIS_SERVICE_VERIFY_SSL: ${CMIS_SERVICE_VERIFY_SSL:-true}
      OFFICE_KU_API_URL: ${OFFICE_KU_API_URL}
      OFFICE_KU_API_TIMEOUT: ${OFFICE_KU_API_TIMEOUT:-30}
      OFFICE_KU_API_VERIFY_SSL: ${OFFICE_KU_API_VERIFY_SSL:-false}
      PORTAL_MAIN_API_KEY: ${PORTAL_MAIN_API_KEY}
      MOCK_LOGIN_ENABLED: ${MOCK_LOGIN_ENABLED:-false}
      MOCK_LOGIN_STUDENT_ENABLED: ${MOCK_LOGIN_STUDENT_ENABLED:-false}
      MOCK_LOGIN_FRONTEND_URL: ${MOCK_LOGIN_FRONTEND_URL:-http://localhost:3008}
      MOCK_LOGIN_STUDENT_FRONTEND_URL: ${MOCK_LOGIN_STUDENT_FRONTEND_URL:-http://localhost:3002}
      MOCK_LOGIN_ADMIN_NONTRI_IDS: ${MOCK_LOGIN_ADMIN_NONTRI_IDS:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3008}
      # GET /api/health. Without HEALTH_TOKEN it still answers ok/failed per
      # check but never shows details. The frontend check calls the web
      # container over the compose network (service name, internal port 80).
      HEALTH_TOKEN: ${HEALTH_TOKEN:-}
      HEALTH_FRONTEND_URL: ${HEALTH_FRONTEND_URL:-http://frontend/}
    ports:
      - "3009:3009"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ../education-web
      dockerfile: Dockerfile.private
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3009/api}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-}
        VITE_MOCK_LOGIN_ENABLED: ${MOCK_LOGIN_ENABLED:-false}
        # VITE_* are baked in at build time: rebuild the frontend after changing them.
        VITE_AUTH_PROVIDER: ${VITE_AUTH_PROVIDER:-portal}
        VITE_PORTAL_LOGIN_URL: ${VITE_PORTAL_LOGIN_URL:-https://office.eng.kps.ku.ac.th/eng-main/home}
        VITE_PORTAL_LOGOUT_URL: ${VITE_PORTAL_LOGOUT_URL:-}
    container_name: web
    ports:
      - "3008:80"
    depends_on:
      - backend

volumes:
  dbdata:
