# kukps-eng-education-ssd - deployed on office.eng.kps.ku.ac.th:
#   web :3008 (staff site), api :3009, queue :3012 (status only), mysql, phpmyadmin.
# The student site (kukps-eng-education-ssd-public, :3007) is a separate stack on
# eng.kps.ku.ac.th: ../education-web/docker-compose.public.yml. Its nginx
# forwards <base path>/api/* to this API.
#
# The server's reverse proxy:
#   /kukps-eng-education-ssd/      -> :3008  (prefix kept or stripped - both work)
#   /kukps-eng-education-ssd-api/  -> :3009  (must strip the prefix)
#
#   docker compose --env-file .env.production up -d --build
#
# First start: put the SQL dump in docker/db/ - mysql loads it only while its
# volume is empty. The api runs no migrations.

# api and queue are the same image with the same settings; only the command
# differs. Settings are listed one by one (not env_file) so that
# --env-file .env.production feeds both compose and the containers.
x-api: &api
  image: kukps-eng-education-ssd-api:latest
  restart: unless-stopped
  environment:
    APP_NAME: ${APP_NAME:-Education API}
    APP_KEY: ${APP_KEY:?APP_KEY must be set (php artisan key:generate --show)}
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: ${APP_DEBUG:-true}
    APP_URL: ${APP_URL:-http://localhost:3009}
    APP_TIMEZONE: ${APP_TIMEZONE:-UTC}
    APP_LOCALE: ${APP_LOCALE:-en}
    APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
    LOG_CHANNEL: ${LOG_CHANNEL:-stack}
    LOG_LEVEL: ${LOG_LEVEL:-debug}
    # Fixed on purpose, not read from .env: the database comes from the SQL
    # dump and has no sessions/cache tables. Cache is files on the shared
    # volume below, which is also how the queue worker's heartbeat reaches
    # /api/health. Queued jobs go to the dump's jobs table.
    SESSION_DRIVER: file
    CACHE_STORE: file
    QUEUE_CONNECTION: database
    # Must be longer than the slowest job, or the job may be picked up again.
    DB_QUEUE_RETRY_AFTER: ${DB_QUEUE_RETRY_AFTER:-1800}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: education_dss
    DB_USERNAME: root
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    JWT_SECRET: ${JWT_SECRET}
    JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    JWT_REQUIRE_EXPIRATION: ${JWT_REQUIRE_EXPIRATION:-false}
    CMIS_URL: ${CMIS_URL}
    CMIS_SERVICE_BASE_PATH: ${CMIS_SERVICE_BASE_PATH:-/api}
    CMIS_SERVICE_TIMEOUT: ${CMIS_SERVICE_TIMEOUT:-15}
    CMIS_SERVICE_VERIFY_SSL: ${CMIS_SERVICE_VERIFY_SSL:-true}
    PERSONNEL_API_URL: ${PERSONNEL_API_URL}
    PORTAL_MAIN_API_KEY: ${PORTAL_MAIN_API_KEY}
    MOCK_LOGIN_ENABLED: ${MOCK_LOGIN_ENABLED:-false}
    MOCK_LOGIN_FRONTEND_URL: ${MOCK_LOGIN_FRONTEND_URL:-http://localhost:3008}
    MOCK_LOGIN_STUDENT_FRONTEND_URL: ${MOCK_LOGIN_STUDENT_FRONTEND_URL:-http://localhost:3007}
    MOCK_LOGIN_ADMIN_NONTRI_IDS: ${MOCK_LOGIN_ADMIN_NONTRI_IDS:-}
    # CORS. The student site calls the API through its own nginx (same
    # origin), so only the staff site needs to be listed.
    FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3008}
    # GET /api/health. Without HEALTH_TOKEN it still answers ok/failed per
    # check but never shows details. The frontend check calls the web
    # container over the compose network.
    HEALTH_TOKEN: ${HEALTH_TOKEN:-}
    HEALTH_FRONTEND_URL: ${HEALTH_FRONTEND_URL:-http://web:3008/healthz}
  volumes:
    - education_api_storage:/var/www/html/storage/app
    - education_api_cache:/var/www/html/storage/framework/cache
    - education_api_logs:/var/www/html/storage/logs
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - education-network
  depends_on:
    mysql:
      condition: service_healthy

services:
  mysql:
    image: mysql:8.0
    container_name: kukps-eng-education-ssd-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: education_dss
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - dbdata:/var/lib/mysql
      - ./docker/db:/docker-entrypoint-initdb.d:ro   # วางไฟล์ dump (.sql) ไว้ในโฟลเดอร์นี้ก่อน docker compose up ครั้งแรก
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - education-network

  api:
    <<: *api
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: kukps-eng-education-ssd-api
    ports:
      - "${API_PORT:-3009}:3009"

  # Runs the queued jobs (grade imports). /healthz on :3012 reports whether
  # the worker is alive; /api/health on the api shows the same as "queue".
  queue:
    <<: *api
    # Uses the image the api service builds (building it twice in parallel fails).
    pull_policy: never
    container_name: kukps-eng-education-ssd-queue
    command: ["queue"]
    ports:
      - "${QUEUE_PORT:-3012}:3012"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3012/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Staff bundle (admin/teacher). VITE_* is baked in at build time - these
  # are the URLs the browser uses. The student bundle is the public stack.
  web:
    image: kukps-eng-education-ssd-web:latest
    build:
      context: ../education-web
      dockerfile: Dockerfile.private
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3009/api}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-}
        VITE_MOCK_LOGIN_ENABLED: ${MOCK_LOGIN_ENABLED:-false}
    container_name: kukps-eng-education-ssd-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3008}:3008"
    networks:
      - education-network

  # Asks for the MySQL user/password on login (no auto-login).
  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: kukps-eng-education-ssd-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    networks:
      - education-network
    depends_on:
      mysql:
        condition: service_healthy

networks:
  education-network:
    driver: bridge

volumes:
  # Same name as before, so an existing database is kept.
  dbdata:
  education_api_storage:
  education_api_cache:
  education_api_logs:
