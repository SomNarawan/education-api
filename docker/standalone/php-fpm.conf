; Standalone image only. nginx runs in the same container, so php-fpm listens
; on a unix socket instead of :9000. With `docker run --network=host` a TCP
; listener would be open on every interface of the server.
; Loaded after zz-docker.conf, which sets `listen = 9000`.

[www]
listen = /run/php-fpm/php-fpm.sock
listen.mode = 0660
