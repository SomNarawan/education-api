; Standalone image (make build / make cd): one container runs nginx, php-fpm and
; the queue worker. supervisord is PID 1 (docker-entrypoint standalone) and runs
; everything as www-data.
;
;   nginx         starts at once; answers a JSON 503 (and /_status) until
;                 php-fpm is up
;   boot          docker-entrypoint boot: caches, waits for the database, runs
;                 migrations, then starts php-fpm and queue-worker. Runs once.
;                 If it fails, nginx keeps answering 503 and /_status says why.
;                 Retry without redeploying:
;                   docker exec <container> supervisorctl start boot
;   php-fpm       started by boot
;   queue-worker  started by boot
;
; supervisord restarts php-fpm, nginx and the queue worker when they exit.

[supervisord]
nodaemon=true
; In the foreground supervisord already prints its own log to stdout; a
; logfile of /dev/stdout would print every line twice.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord/supervisord.pid

; Only for supervisorctl inside the container (boot uses it). The socket is
; private to www-data; the credentials only silence supervisord's
; "running without any HTTP authentication checking" warning.
[unix_http_server]
file=/run/supervisord/supervisor.sock
chmod=0700
username=local
password=local

[supervisorctl]
serverurl=unix:///run/supervisord/supervisor.sock
username=local
password=local

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:nginx]
command=nginx -e stderr
priority=10
autorestart=true
; nginx finishes in-flight requests on SIGQUIT.
stopsignal=QUIT
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:boot]
command=docker-entrypoint boot
directory=/var/www/html
priority=20
autorestart=false
; A quick exit is the normal outcome, not a failed start.
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:php-fpm]
command=php-fpm
priority=30
autostart=false
autorestart=true
; php-fpm drains in-flight requests on SIGQUIT (process_control_timeout 50s).
stopsignal=QUIT
stopwaitsecs=55
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:queue-worker]
command=php artisan queue:work --sleep=3 --tries=3 --timeout=90
directory=/var/www/html
priority=40
autostart=false
autorestart=true
; queue:work finishes the current job on SIGTERM, then exits.
stopsignal=TERM
stopwaitsecs=180
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
