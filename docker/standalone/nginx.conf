# nginx main config for the standalone image. Runs as www-data under
# supervisord, so pid and temp files live in /run/nginx (owned by www-data).
# The server block is rendered by docker-entrypoint from
# default.conf.template into /run/nginx/conf.d at container start.

worker_processes auto;
pid /run/nginx/nginx.pid;
error_log stderr warn;
daemon off;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    client_body_temp_path /run/nginx/client_body;
    fastcgi_temp_path     /run/nginx/fastcgi;
    proxy_temp_path       /run/nginx/proxy;
    uwsgi_temp_path       /run/nginx/uwsgi;
    scgi_temp_path        /run/nginx/scgi;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    include /run/nginx/conf.d/*.conf;
}
