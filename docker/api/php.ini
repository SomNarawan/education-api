; Values carried over from the webdevops/php-nginx image this replaced.
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
post_max_size = 50M
upload_max_filesize = 50M
date.timezone = UTC

opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code never changes inside a built image, so skip the per-request file stat.
; Rebuild the image to deploy new code.
opcache.validate_timestamps = 0
