; Production overrides, loaded after php.ini-production.
; ${VAR} values come from ENV defaults in the Dockerfile and can be
; overridden per service in docker-compose.yml.

expose_php = Off
memory_limit = ${PHP_MEMORY_LIMIT}
; Only applies to php-fpm; the CLI (queue worker, artisan) is always unlimited.
max_execution_time = ${PHP_MAX_EXECUTION_TIME}
max_input_vars = 5000

; Imports accept xlsx up to 20 MB (max:20480 in the FormRequests).
upload_max_filesize = ${PHP_UPLOAD_MAX_FILESIZE}
post_max_size = ${PHP_POST_MAX_SIZE}

realpath_cache_size = 4096K
realpath_cache_ttl = 600

[opcache]
opcache.enable = 1
; CLI processes are short-lived (artisan) or compile once (queue:work).
opcache.enable_cli = 0
opcache.memory_consumption = ${PHP_OPCACHE_MEMORY}
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code inside the image never changes, so never stat() files.
; A deploy replaces the container, which starts with an empty cache.
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq = 0
opcache.save_comments = 1
