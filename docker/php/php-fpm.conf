; Loaded after the image's docker.conf / www.conf / zz-docker.conf.
; docker.conf already sends error_log to stderr with catch_workers_output=yes,
; so Laravel's stderr log channel shows up in `docker logs`.

[global]
; On SIGQUIT (docker stop), wait this long for workers to finish
; in-flight requests. Keep below stop_grace_period in docker-compose.yml.
process_control_timeout = 50s

[www]
; The container runs as www-data, so the user/group directives in www.conf
; are ignored (fpm logs a notice about it at startup).

pm = dynamic
pm.max_children = ${FPM_PM_MAX_CHILDREN}
pm.start_servers = ${FPM_PM_START_SERVERS}
pm.min_spare_servers = ${FPM_PM_MIN_SPARE_SERVERS}
pm.max_spare_servers = ${FPM_PM_MAX_SPARE_SERVERS}
; Recycle workers periodically to cap slow memory growth.
pm.max_requests = ${FPM_PM_MAX_REQUESTS}

; nginx already logs every request; avoid writing each one twice.
access.log = /dev/null

; Keep the container environment visible to PHP (same as the previous image).
clear_env = no

; Used by php-fpm-healthcheck.
ping.path = /fpm-ping
ping.response = pong
