# Skip access-log lines for healthcheck probes.
map $request_uri $loggable {
    ~^/up(\?|$)  0;
    default      1;
}

server {
    # IPv4 only: Docker publishes the port over IPv4, and an IPv6 listen
    # fails to start on hosts with IPv6 disabled.
    listen 3009 default_server;
    server_name _;

    root /var/www/html/public;
    index index.php;

    server_tokens off;
    access_log /var/log/nginx/access.log main if=$loggable;

    # Imports accept xlsx up to 20 MB (max:20480). nginx defaults to 1 MB.
    client_max_body_size 25m;

    # Docker's embedded DNS, re-resolved every 10s, so nginx follows
    # laravel-app when it is recreated on deploy or scaled to several replicas.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream laravel-app:9000;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Only the front controller is executable.
    location = /index.php {
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;

        # Matches PHP max_execution_time (300s); long synchronous imports.
        fastcgi_read_timeout 300s;
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
