upstream php {
    server 127.0.0.1:9000;
}

server {
    # เปลี่ยนจาก 80 เป็น 3009
    listen 3009 default_server;
    listen [::]:3009 default_server;

    server_name _;
    root /app/public;
    index index.php index.html index.htm;

    # Excel imports (students/grades). nginx defaults to 1M, which rejects
    # larger files with 413 before they reach Laravel. Keep in step with
    # post_max_size / upload_max_filesize in docker/api/php.ini.
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Imports run inside the request. nginx defaults to 60s and answers
        # 504 while PHP keeps working; match max_execution_time in php.ini.
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }
}
